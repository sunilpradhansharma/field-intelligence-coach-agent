<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Complete target architecture of the Field Intelligence Coach Agent with all capabilities">
  <style>
    .bg{fill:#FAF8F3}
    .title{fill:#2A2622;font-size:19px;font-weight:700}
    .subtitle{fill:#6B655C;font-size:11px}
    .band{fill:#8A8378;font-size:10.5px;font-weight:700;letter-spacing:0.5px}
    .ct{fill:#2A2622;font-size:13px;font-weight:600}
    .cs{fill:#5C564D;font-size:9.5px}
    .et{fill:#23404F;font-size:11.5px;font-weight:600}
    .es{fill:#4C5E69;font-size:9px}
    .note{fill:#6B655C;font-size:9.5px;font-style:italic}
    .card{fill:#EDEFEE;stroke:#707A76;stroke-width:1}
    .exp{fill:#E6EEF3;stroke:#5A7689;stroke-width:1}
    .intel{fill:#ECE7F1;stroke:#7E6E94;stroke-width:1}
    .ai{fill:#F3ECE2;stroke:#A98C66;stroke-width:1}
    .door{fill:#D7E9E1;stroke:#2E7D6B;stroke-width:2}
    .src{fill:#F0E9DF;stroke:#9A8B73;stroke-width:1}
    .arrow{stroke:#8A8378;stroke-width:1.6;fill:none}
    .div{stroke:#C7C1B6;stroke-width:1;stroke-dasharray:4 4}
  </style>
  <rect class="bg" x="0" y="0" width="1120" height="900"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 2 L8 5 L2 8" fill="none" stroke="#8A8378" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M8 2 L2 5 L8 8" fill="none" stroke="#8A8378" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <text class="title" x="560" y="32" text-anchor="middle">Field Intelligence Coach Agent — complete architecture</text>
  <text class="subtitle" x="560" y="50" text-anchor="middle">the full system with every capability</text>

  <!-- ROLES -->
  <text class="band" x="165" y="93" text-anchor="end">ROLES</text>
  <rect class="card" x="180" y="70" width="910" height="44" rx="7"/>
  <text class="ct" x="635" y="89" text-anchor="middle">District manager · RD · RBE · Head of Sales</text>
  <text class="cs" x="635" y="104" text-anchor="middle">scope: self · district · region · all</text>
  <line class="arrow" x1="635" y1="114" x2="635" y2="130" marker-end="url(#a)"/>

  <!-- EXPERIENCE -->
  <text class="band" x="165" y="161" text-anchor="end">EXPERIENCE</text>
  <rect class="exp" x="180" y="132" width="445" height="50" rx="7"/>
  <text class="et" x="402" y="152" text-anchor="middle">DM workspace</text>
  <text class="es" x="402" y="167" text-anchor="middle">morning brief + CLOSE capture</text>
  <rect class="exp" x="645" y="132" width="445" height="50" rx="7"/>
  <text class="et" x="867" y="152" text-anchor="middle">Leadership dashboard</text>
  <text class="es" x="867" y="167" text-anchor="middle">aggregated coaching themes</text>
  <line class="arrow" x1="635" y1="182" x2="635" y2="198" marker-end="url(#a)"/>

  <!-- API -->
  <text class="band" x="165" y="223" text-anchor="end">API</text>
  <rect class="card" x="180" y="200" width="910" height="44" rx="7"/>
  <text class="ct" x="635" y="219" text-anchor="middle">API — FastAPI</text>
  <text class="cs" x="635" y="234" text-anchor="middle">read: briefs + themes · write: CLOSE notes · resolves identity into an AccessContext</text>
  <line class="arrow" x1="635" y1="244" x2="635" y2="260" marker-end="url(#a)"/>

