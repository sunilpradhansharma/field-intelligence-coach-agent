  <text class="band" x="165" y="285" text-anchor="end">ORCHESTRATION</text>
  <rect class="card" x="180" y="262" width="910" height="44" rx="7"/>
  <text class="ct" x="635" y="281" text-anchor="middle">Orchestrator — LangGraph (fixed graph)</text>
  <text class="cs" x="635" y="296" text-anchor="middle">narrate-before-expose · recommendations are suggestion-only, the human decides</text>
  <line class="arrow" x1="635" y1="306" x2="635" y2="322" marker-end="url(#a)"/>

