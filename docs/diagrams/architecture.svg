  <text class="band" x="165" y="421" text-anchor="end">INTELLIGENCE</text>
  <rect class="intel" x="180" y="394" width="290" height="52" rx="7"/>
  <text class="et" x="325" y="416" text-anchor="middle">Summit optimizer</text>
  <text class="es" x="325" y="431" text-anchor="middle">biggest ranking lift  ·  feeds Ranking</text>
  <rect class="intel" x="490" y="394" width="290" height="52" rx="7"/>
  <text class="et" x="635" y="416" text-anchor="middle">Covariant analysis</text>
  <text class="es" x="635" y="431" text-anchor="middle">winning blend of variables  ·  feeds Accounts</text>
  <rect class="intel" x="800" y="394" width="290" height="52" rx="7"/>
  <text class="et" x="945" y="416" text-anchor="middle">Theme aggregation</text>
  <text class="es" x="945" y="431" text-anchor="middle">patterns across reps  ·  feeds Leadership</text>
  <text class="note" x="180" y="462" text-anchor="start">All builders + intelligence share one signal rollup (signals.py) — consistent numbers, no drift.</text>
  <line class="arrow" x1="635" y1="446" x2="635" y2="476" marker-end="url(#a)"/>

  <!-- AI and capture -->
  <text class="band" x="165" y="503" text-anchor="end">AI &amp; CAPTURE</text>
  <rect class="ai" x="180" y="478" width="208" height="50" rx="7"/>
  <text class="et" x="284" y="498" text-anchor="middle">Claude on Bedrock</text>
  <text class="es" x="284" y="513" text-anchor="middle">narration + summaries</text>
  <rect class="ai" x="414" y="478" width="208" height="50" rx="7"/>
  <text class="et" x="518" y="498" text-anchor="middle">Titan embeddings</text>
  <text class="es" x="518" y="513" text-anchor="middle">notes search</text>
  <rect class="ai" x="648" y="478" width="208" height="50" rx="7"/>
  <text class="et" x="752" y="498" text-anchor="middle">Amazon Transcribe</text>
  <text class="es" x="752" y="513" text-anchor="middle">voice to text</text>
  <rect class="ai" x="882" y="478" width="208" height="50" rx="7"/>
  <text class="et" x="986" y="498" text-anchor="middle">CLOSE capture</text>
  <text class="es" x="986" y="513" text-anchor="middle">voice notes to structured (write)</text>
  <line class="arrow" x1="635" y1="528" x2="635" y2="546" marker-end="url(#a)"/>

  <!-- DATA ACCESS (door) -->
  <text class="band" x="165" y="577" text-anchor="end">DATA ACCESS</text>
  <rect class="door" x="180" y="548" width="910" height="58" rx="7"/>
  <text class="ct" x="635" y="568" text-anchor="middle">Data-access layer — THE SINGLE DOOR</text>
  <text class="cs" x="635" y="584" text-anchor="middle">RBAC scope (self/district/region/all) + PRP scrubbing · read + write · AccessContext / ScopeError</text>
  <text class="cs" x="635" y="597" text-anchor="middle">notes retriever enforces the same RBAC + PRP at query time</text>
  <line class="arrow" x1="635" y1="606" x2="635" y2="624" marker-end="url(#a)"/>

  <!-- STORES -->
  <text class="band" x="165" y="649" text-anchor="end">STORES</text>
  <rect class="card" x="180" y="626" width="290" height="48" rx="7"/>
  <text class="ct" x="325" y="646" text-anchor="middle">Structured store</text>
  <text class="cs" x="325" y="661" text-anchor="middle">reps · accounts · per-brand metrics</text>
  <rect class="card" x="490" y="626" width="290" height="48" rx="7"/>
  <text class="ct" x="635" y="646" text-anchor="middle">Vector store</text>
  <text class="cs" x="635" y="661" text-anchor="middle">coaching notes</text>
  <rect class="card" x="800" y="626" width="290" height="48" rx="7"/>
  <text class="ct" x="945" y="646" text-anchor="middle">Coaching-close records</text>
  <text class="cs" x="945" y="661" text-anchor="middle">written back after rides (the loop)</text>
  <line class="arrow" x1="635" y1="700" x2="635" y2="676" marker-end="url(#a)"/>
  <text class="note" x="660" y="692" text-anchor="start">ingest + PRP scrub</text>

  <!-- DATA SOURCES -->
  <text class="band" x="165" y="727" text-anchor="end">DATA SOURCES</text>
  <rect class="src" x="180" y="702" width="166" height="50" rx="7"/>
  <text class="ct" x="263" y="722" text-anchor="middle" font-size="12">Veeva</text>
  <text class="cs" x="263" y="737" text-anchor="middle">CRM · notes</text>
  <rect class="src" x="366" y="702" width="166" height="50" rx="7"/>
  <text class="ct" x="449" y="722" text-anchor="middle" font-size="12">IQVIA</text>
  <text class="cs" x="449" y="737" text-anchor="middle">scripts</text>
  <rect class="src" x="552" y="702" width="166" height="50" rx="7"/>
  <text class="ct" x="635" y="722" text-anchor="middle" font-size="12">AEBAT</text>
  <text class="cs" x="635" y="737" text-anchor="middle">spend</text>
  <rect class="src" x="738" y="702" width="166" height="50" rx="7"/>
  <text class="ct" x="821" y="722" text-anchor="middle" font-size="12">Dashboards</text>
  <text class="cs" x="821" y="737" text-anchor="middle">share · volume</text>
  <rect class="src" x="924" y="702" width="166" height="50" rx="7"/>
  <text class="ct" x="1007" y="722" text-anchor="middle" font-size="12">Summit files</text>
  <text class="cs" x="1007" y="737" text-anchor="middle">calc logic</text>

  <line class="div" x1="60" y1="770" x2="1060" y2="770"/>

  <!-- CROSS-CUTTING -->
  <text class="band" x="165" y="800" text-anchor="end">CROSS-CUTTING</text>
  <rect class="card" x="180" y="782" width="208" height="48" rx="7"/>
  <text class="ct" x="284" y="802" text-anchor="middle" font-size="12">Config</text>
  <text class="cs" x="284" y="817" text-anchor="middle">weights · caps · catalogs · role map</text>
  <rect class="card" x="414" y="782" width="208" height="48" rx="7"/>
  <text class="ct" x="518" y="802" text-anchor="middle" font-size="12">Principles</text>
  <text class="cs" x="518" y="817" text-anchor="middle">a reason on everything · human decides</text>
  <rect class="card" x="648" y="782" width="208" height="48" rx="7"/>
  <text class="ct" x="752" y="802" text-anchor="middle" font-size="12">Security</text>
  <text class="cs" x="752" y="817" text-anchor="middle">Cognito · Bedrock Guardrails</text>
  <rect class="card" x="882" y="782" width="208" height="48" rx="7"/>
  <text class="ct" x="986" y="802" text-anchor="middle" font-size="12">Observability</text>
  <text class="cs" x="986" y="817" text-anchor="middle">privacy-safe logs · audit</text>

  <text class="note" x="560" y="858" text-anchor="middle">Production data platform: Aurora / Athena (structured) · Bedrock Knowledge Bases / OpenSearch (vector)</text>
</svg>
