  <text class="band" x="165" y="351" text-anchor="end">BRIEF BUILDERS</text>
  <rect class="card" x="180" y="324" width="166" height="52" rx="7"/>
  <text class="ct" x="263" y="346" text-anchor="middle" font-size="12">Ranking</text>
  <text class="cs" x="263" y="361" text-anchor="middle">who &amp; why</text>
  <rect class="card" x="366" y="324" width="166" height="52" rx="7"/>
  <text class="ct" x="449" y="346" text-anchor="middle" font-size="12">Coaching focus</text>
  <text class="cs" x="449" y="361" text-anchor="middle">what to coach</text>
  <rect class="card" x="552" y="324" width="166" height="52" rx="7"/>
  <text class="ct" x="635" y="346" text-anchor="middle" font-size="12">Ride-along prep</text>
  <text class="cs" x="635" y="361" text-anchor="middle">what happened last</text>
  <rect class="card" x="738" y="324" width="166" height="52" rx="7"/>
  <text class="ct" x="821" y="346" text-anchor="middle" font-size="12">Accounts + context</text>
  <text class="cs" x="821" y="361" text-anchor="middle">per-brand · mismatch</text>
  <rect class="card" x="924" y="324" width="166" height="52" rx="7"/>
  <text class="ct" x="1007" y="346" text-anchor="middle" font-size="12">Opener</text>
  <text class="cs" x="1007" y="361" text-anchor="middle">how to open</text>
  <line class="arrow" x1="635" y1="376" x2="635" y2="392" marker-end="url(#a)"/>

